# Production profile — override via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexahr_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:nexahr-super-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long}
cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}

server.error.include-message=never
server.error.include-stacktrace=never
