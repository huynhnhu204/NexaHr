spring.application.name=nexahr-backend
server.port=8080

spring.config.import=optional:classpath:application-local.properties

# Mặc định MySQL (phpMyAdmin / nexahr_db). Dùng H2 in-memory: SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JWT
jwt.secret=nexahr-super-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
jwt.expiration=3600000
jwt.refresh.expiration=604800000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
cors.allowed-origins=http://localhost:5173

# SQL init - using Java DataSeeder instead
spring.sql.init.mode=never

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@nexahr.com}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google OAuth (để trống = tắt SSO)
google.client.id=${GOOGLE_CLIENT_ID:}

# Stripe (để trống = chế độ demo)
stripe.enabled=${STRIPE_ENABLED:false}
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# OpenAI LLM (để trống = rule-based Copilot)
openai.enabled=${OPENAI_ENABLED:false}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Push notifications (FCM key để trống = chế độ demo log)
push.enabled=${PUSH_ENABLED:true}
push.fcm.server-key=${FCM_SERVER_KEY:}
