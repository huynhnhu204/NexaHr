# MySQL — dữ liệu lưu vào nexahr_db (xem qua phpMyAdmin / Herd)
# Herd mặc định: root KHÔNG mật khẩu — chạy: unset DB_PASSWORD && mvn spring-boot:run
# Nếu MySQL có mật khẩu: DB_PASSWORD=mat_khau_cua_ban mvn spring-boot:run

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/nexahr_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
